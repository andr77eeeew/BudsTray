name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build BudsTray.slnx -c Release

      - name: Test
        run: dotnet test tests/BudsTray.Tests -c Release --no-build

      - name: Publish
        run: dotnet publish src/BudsTray/BudsTray.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:PublishReadyToRun=true -o publish

      - uses: actions/upload-artifact@v7
        with:
          name: BudsTray-win-x64
          path: publish/BudsTray.exe
          retention-days: 14
